name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Backend: linter (Pint) + suite PHPUnit sobre SQLite en memoria ----
  php:
    name: PHP — Pint + PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache de vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependencias (Composer)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Linter — Laravel Pint
        run: vendor/bin/pint --test

      - name: Auditoría de dependencias (informativa)
        run: composer audit
        continue-on-error: true

      - name: Las rutas cargan sin errores
        run: php artisan route:list

      - name: Tests — PHPUnit (SQLite en memoria)
        run: php artisan test

  # ---- Motores reales: la misma suite contra MySQL y PostgreSQL ----
  #
  # El job `php` corre en SQLite porque es rápido, pero SQLite perdona cosas
  # que los motores de producción no: así se coló un `DATE_FORMAT` con acentos
  # graves que reventaba en PostgreSQL nada más abrir el panel. Este job es
  # lo único que impide que vuelva a pasar.
  #
  # Los dos servicios se levantan siempre (GitHub Actions no permite
  # declararlos por variante de la matriz); cada variante usa el suyo.
  db-engines:
    name: BD — PHPUnit en ${{ matrix.engine.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # que un motor falle no debe ocultar el estado del otro
      matrix:
        engine:
          - name: MySQL 8
            connection: mysql
            port: 3306
            user: root
          - name: PostgreSQL 16
            connection: pgsql
            port: 5432
            user: postgres

    services:
      # Sin contraseña a propósito: son contenedores efímeros, aislados en la
      # red del job y destruidos al terminar. Poner una la haría parecer un
      # secreto sin proteger nada — y un literal así lo marca el escáner de
      # secretos, con razón: no se distingue de una credencial de verdad.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: finlia_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: finlia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, curl, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Cache de vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias (Composer)
        run: composer install --prefer-dist --no-interaction --no-progress

      # Las variables de entorno reales ganan sobre los <env> de phpunit.xml
      # (no llevan force="true"), así que la misma suite corre contra el motor
      # de la variante sin tocar la configuración.
      - name: Tests — PHPUnit en ${{ matrix.engine.name }}
        env:
          DB_CONNECTION: ${{ matrix.engine.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.engine.port }}
          DB_DATABASE: finlia_test
          DB_USERNAME: ${{ matrix.engine.user }}
          DB_PASSWORD: ''
        run: php artisan test

  # ---- Frontend: los assets de Vite compilan en producción ----
  assets:
    name: Assets — build Vite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm)
        run: npm ci

      - name: Compilar assets de producción
        run: npm run build

  # ---- E2E: Playwright (Chromium) contra Laravel con SQLite + seed ----
  e2e:
    name: E2E — Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (Composer)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Instalar dependencias (npm)
        run: npm ci

      - name: Compilar assets de producción
        run: npm run build

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        run: npx playwright test

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
